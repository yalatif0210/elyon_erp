<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elyon Trading</title>
<meta name="robots" content="noindex">
<style>
  :root {
    color-scheme: light;
    --ink: #17222E;
    --ink-soft: #4C5A6B;
    --ground: #F7F8FA;
    --surface: #FFFFFF;
    --rule: #D3DAE2;
    --accent: #17222E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ground);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  main {
    max-width: 480px;
    margin: 24px;
    padding: 40px 36px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 6px;
    text-align: center;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  p.tagline {
    margin: 0 0 28px;
    font-size: 14px;
    color: var(--ink-soft);
  }
  p.notice {
    margin: 0;
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink-soft);
    padding-top: 20px;
    border-top: 1px solid var(--rule);
  }
</style>
</head>
<body>
  <main>
    <h1>Elyon Trading</h1>
    <p class="tagline">Négoce, distribution et transport d'hydrocarbures — Côte d'Ivoire</p>
    <p class="notice">Ce site est en cours de construction.</p>
  </main>
</body>
</html>
