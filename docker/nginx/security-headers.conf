# ===========================================================================
#  En-têtes de sécurité — fragment inclus dans CHAQUE bloc location.
#
#  ⚠️ PIÈGE NGINX : les directives `add_header` ne s'héritent du niveau
#     supérieur QUE si le niveau courant n'en déclare aucune. Un seul
#     `add_header Cache-Control` dans un `location` annule silencieusement
#     tous les en-têtes de sécurité définis au niveau `server`.
#
#     D'où ce fragment, réinclus explicitement partout où un location
#     définit ses propres en-têtes.
# ===========================================================================

add_header X-Content-Type-Options "nosniff"     always;
add_header X-Frame-Options        "DENY"        always;
add_header Referrer-Policy        "no-referrer" always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Angular applique ses styles de composant en ligne : 'unsafe-inline' est
# nécessaire sur style-src, mais PAS sur script-src — le bundle esbuild
# n'exécute aucun script en ligne.
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    always;
