# ===========================================================================
#  Console interne — service statique et relais d'API
#
#  L'API est relayée sous le même domaine que l'application : le navigateur ne
#  voit qu'une seule origine, ce qui supprime le CORS et permettra plus tard
#  d'utiliser des cookies httpOnly pour les jetons.
# ===========================================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Répertoires d'écriture de nginx, pour un système de fichiers en lecture seule.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # --- Relais vers l'API -------------------------------------------------
    #  Pas d'en-têtes de sécurité ici : l'API pose les siens via Helmet et ils
    #  traversent le relais. En ajouter produirait deux CSP concurrentes, que
    #  le navigateur intersecte — comportement correct mais pénible à déboguer.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Pièces jointes du terrain (§ 10.2). La valeur est VOLONTAIREMENT
        # au-dessus du plafond technique de l'API (32 Mo), lui-même au-dessus
        # du plafond métier (paramètre FIELD_ATTACHMENT_MAX_MB).
        #
        # ⚠️ Réglée en dessous, c'est NGINX qui refuse — par une page HTML
        #    « 413 Request Entity Too Large », en anglais, sans rapport avec le
        #    métier. L'agent sur sa tablette n'apprend ni le plafond, ni qu'il
        #    faut compresser. Le refus doit venir de l'application, qui sait
        #    quoi dire.
        client_max_body_size 40m;
        # Le corps ne transite pas par un fichier tampon avant d'être relayé :
        # inutile pour cette taille, et le conteneur nginx est en lecture seule.
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://api:3000/health;
    }

    # --- Fichiers empreintés : cache long, ils changent de nom à chaque build
    location ~* \.(js|css|woff2?|svg|png|jpg|webp|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }

    # --- Application monopage : toute route inconnue rend index.html -------
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
