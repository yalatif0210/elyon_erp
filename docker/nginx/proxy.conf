# ===========================================================================
#  RELAIS PUBLIC — un seul point d'entrée sur le VPS, un bloc par sous-domaine
#  Réf. DEPLOIEMENT.md
#
#  Cloudflare est devant ce relais, en mode « Full (strict) » : la connexion
#  Cloudflare → origine est TOUJOURS chiffrée, validée contre le certificat
#  d'origine Cloudflare posé ci-dessous (voir DEPLOIEMENT.md pour l'obtenir).
#  Ce relais ne fait QUE router par nom d'hôte vers le bon conteneur — chaque
#  application garde son propre relais interne (`web.conf`) pour /api.
# ===========================================================================

# --- Ports d'écriture, pour un conteneur en lecture seule -------------------
client_body_temp_path /tmp/client_temp;
proxy_temp_path       /tmp/proxy_temp;
fastcgi_temp_path     /tmp/fastcgi_temp;
uwsgi_temp_path       /tmp/uwsgi_temp;
scgi_temp_path        /tmp/scgi_temp;

server_tokens off;

# ⚠️ RÉSOLVEUR DOCKER + `proxy_pass` SUR VARIABLE — SANS CELA, UN
#    REDÉPLOIEMENT DE `web` OU `portal` LAISSE CE RELAIS SOURD.
#
#    `proxy_pass http://web:8080` littéral résout le nom UNE FOIS, au
#    démarrage de nginx, et garde l'adresse IP en mémoire indéfiniment —
#    constaté en testant ce fichier hors de `docker compose`, où nginx refuse
#    même de démarrer faute de résoudre "web". En production, le nom résout
#    bien AU DÉMARRAGE (grâce à `depends_on: condition: service_healthy` côté
#    `docker-compose.prod.yml`), mais un redéploiement ultérieur de `web` ou
#    `portal` — un geste ordinaire, pas un incident — leur donne une NOUVELLE
#    adresse IP que ce relais, démarré avant, ne réapprend jamais tout seul.
#    Il continuerait de router vers un conteneur qui n'existe plus, jusqu'à
#    son propre redémarrage.
#
#    Passer par une VARIABLE force nginx à consulter le résolveur DNS interne
#    de Docker (127.0.0.11) À CHAQUE requête (dans la limite de `valid=`),
#    au lieu de résoudre une fois pour toutes.
resolver 127.0.0.11 valid=10s;

# --- Tout le trafic HTTP direct (hors Cloudflare) est renvoyé vers HTTPS ---
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
#  Fragment commun à tous les blocs HTTPS ci-dessous.
# ---------------------------------------------------------------------------
# (nginx n'a pas d'inclusion de bloc paramétrable — les directives TLS sont
#  donc répétées dans chaque server{}, ce qui est le prix normal de plusieurs
#  vhosts sur un même certificat.)

# --- Vitrine ----------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name elyon-trading.com www.elyon-trading.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/vitrine;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ =404;
}

# --- ERP — console interne + portail terrain (même application) ------------
server {
    listen 443 ssl;
    http2 on;
    server_name erp.elyon-trading.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        set $upstream_web http://web:8080;
        proxy_pass $upstream_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Pièces jointes du terrain (§ 10.2) — voir web.conf, même plafond.
        client_max_body_size 40m;
        proxy_request_buffering off;
    }
}

# --- Terrain — MÊME application que ci-dessus, sous-domaine dédié ----------
#
#  ⚠️ Un seul build Angular sert les deux réalms (§ app.routes.ts) : la
#     console et le terrain sont deux arbres de routes distincts dans la même
#     application, avec des gardes et des sessions séparées. Ce sous-domaine
#     ne fait que donner à l'agent une adresse à lui — il ne recharge rien de
#     différent. Seule la racine ('/') est redirigée vers l'écran de
#     connexion terrain ; le reste suit le chemin /terrain/... normal de
#     l'application.
server {
    listen 443 ssl;
    http2 on;
    server_name terrain.elyon-trading.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = / {
        return 302 /terrain/connexion;
    }

    # ⚠️ /connexion (sans préfixe) MÈNE À LA CONNEXION INTERNE, PAS TERRAIN.
    #
    #    Le routage Angular ne dépend que du chemin, jamais du nom d'hôte -
    #    un agent qui saisit `/connexion` sur ce sous-domaine reçoit la page
    #    de connexion BUREAUTIQUE, qui ne consulte que les comptes internes.
    #    Un compte terrain y est rejeté avec le même « Identifiants
    #    invalides » générique qu'un vrai mauvais mot de passe - constaté en
    #    direct, source d'une confusion longue à démêler. Ce renvoi
    #    intercepte l'erreur de frappe la plus probable avant qu'elle ne se
    #    reproduise.
    location = /connexion {
        return 302 /terrain/connexion;
    }

    location / {
        set $upstream_web http://web:8080;
        proxy_pass $upstream_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 40m;
        proxy_request_buffering off;
    }
}

# --- Portail client -----------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name portail.elyon-trading.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        set $upstream_portal http://portal:4000;
        proxy_pass $upstream_portal;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
