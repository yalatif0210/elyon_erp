# ===========================================================================
#  RELAIS PUBLIC — STAGING
#  Réf. DEPLOIEMENT_STAGING.md
#
#  Copie de proxy.conf pour le second VPS de staging : mêmes blocs, sous-
#  domaines distincts, pas de vitrine à servir. Sélectionné à la construction
#  par docker-compose.staging.yml via l'ARG NGINX_CONF de proxy.Dockerfile —
#  toute correction de routage ou d'en-tête faite dans proxy.conf doit être
#  reportée ici à la main, les deux fichiers ne se déduisent pas l'un de
#  l'autre.
# ===========================================================================

# --- Ports d'écriture, pour un conteneur en lecture seule -------------------
client_body_temp_path /tmp/client_temp;
proxy_temp_path       /tmp/proxy_temp;
fastcgi_temp_path     /tmp/fastcgi_temp;
uwsgi_temp_path       /tmp/uwsgi_temp;
scgi_temp_path        /tmp/scgi_temp;

server_tokens off;

# Résolveur Docker + proxy_pass sur variable — voir proxy.conf pour le pourquoi
# détaillé (un redéploiement de `web` ou `portal` laisserait sinon ce relais
# sourd, avec une IP mise en cache indéfiniment par nginx).
resolver 127.0.0.11 valid=10s;

# --- Tout le trafic HTTP direct (hors Cloudflare) est renvoyé vers HTTPS ---
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- ERP — console interne + portail terrain (même application) ------------
server {
    listen 443 ssl;
    http2 on;
    server_name staging-erp.elyon-trading.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        set $upstream_web http://web:8080;
        proxy_pass $upstream_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 40m;
        proxy_request_buffering off;
    }
}

# --- Terrain — MÊME application que ci-dessus, sous-domaine dédié ----------
server {
    listen 443 ssl;
    http2 on;
    server_name staging-terrain.elyon-trading.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = / {
        return 302 /terrain/connexion;
    }

    location / {
        set $upstream_web http://web:8080;
        proxy_pass $upstream_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 40m;
        proxy_request_buffering off;
    }
}

# --- Portail client -----------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name staging-portail.elyon-trading.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        set $upstream_portal http://portal:4000;
        proxy_pass $upstream_portal;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
