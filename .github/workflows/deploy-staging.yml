name: Déploiement staging

# Réf. DEPLOIEMENT_STAGING.md et le plan « staging d'abord ».
#
# Se déclenche une fois que le workflow CI a réussi sur `dev` — jamais avant :
# un déploiement automatique sans passer par la recette n'aurait aucune valeur
# de garde-fou.
#
# ⚠️ AUCUNE RECONSTRUCTION SUR LE VPS — LES IMAGES SONT CELLES DÉJÀ TESTÉES.
#
#    `api`, `web` et `portal` sont récupérées telles quelles depuis GHCR, au
#    SHA exact qui vient de passer les 222 cas de recette dans `ci.yml` —
#    jamais rebâties ici. Le VPS n'a donc plus besoin du kit de compilation
#    complet (chromium, node_modules de développement…) pour ces trois
#    services : seul `proxy` continue de se construire localement (sa
#    configuration nginx diffère par environnement, rien de coûteux à
#    reconstruire). C'est ce qui garantit qu'un déploiement staging réussi et
#    un déploiement production ultérieur du même commit installent
#    EXACTEMENT le même binaire, pas une reconstruction « équivalente ».
#
# ⚠️ Ce workflow ne peut se déclencher avec succès qu'une fois le second VPS
#    provisionné et les secrets de l'environnement GitHub `staging` posés
#    (voir DEPLOIEMENT_STAGING.md). Tant que ce n'est pas fait, il échoue à la
#    connexion SSH — normal, pas un défaut du workflow lui-même.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [dev]
    types: [completed]

concurrency:
  group: deploy-staging
  cancel-in-progress: false # Un déploiement en cours ne doit jamais être interrompu à mi-chemin.

jobs:
  deploy:
    name: Déployer sur staging
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      # Lecture seule : ce job ne fait que récupérer les images déjà publiées
      # par ci.yml, jamais en publier de nouvelles.
      packages: read
    steps:
      - name: Charger la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Connaître l'empreinte de l'hôte
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.STAGING_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Déployer
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          # Jeton de CE job, forgé pour l'occasion par GitHub, jamais stocké :
          # il n'a besoin de vivre que le temps de la connexion `docker login`
          # ci-dessous. Aucun jeton longue durée à gérer ni à faire tourner.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          API_IMAGE: ghcr.io/${{ github.repository }}/api
          WEB_IMAGE: ghcr.io/${{ github.repository }}/web
          PORTAL_IMAGE: ghcr.io/${{ github.repository }}/portal
        run: |
          # ⚠️ CE SCRIPT DISTANT PART TOUJOURS EN HEREDOC LITTÉRAL (<<'REMOTE',
          #    guillemets sur le marqueur), JAMAIS EN <<REMOTE NU — et n'est
          #    JAMAIS DIFFUSÉ EN DIRECT SUR LE FLUX SSH.
          #
          #    Deux défauts distincts ont été constatés en direct sur ce
          #    même bloc, l'un après l'autre :
          #
          #    1. Un marqueur non protégé fait interpoler CE SHELL-CI (le
          #       runner GitHub, pas le VPS) tous les `$var`/`${...}` du
          #       corps AVANT l'envoi en SSH - le moindre antislash oublié
          #       fait fuir des mots nus exécutés en silence par le runner.
          #       Réglé par le marqueur protégé : le corps part mot pour
          #       mot, plus un seul `$` à échapper ici.
          #
          #    2. Une fois ce premier défaut réglé, un déploiement a quand
          #       même rapporté un succès crédible (4 min, git+pull+
          #       migrations bien réels) SANS que les conteneurs ne soient
          #       recréés - vérifié en direct par SSH manuel : la logique du
          #       script elle-même s'est révélée irréprochable (reproduite
          #       trois fois à la main, `up -d` recrée toujours correctement
          #       quand l'image change). La connexion à ce VPS s'est aussi
          #       révélée intermittente ce jour-là (deux « connection reset »
          #       constatés en direct, l'un côté runner, l'un depuis un poste
          #       different). Un heredoc DIFFUSÉ EN DIRECT sur le canal SSH
          #       n'a AUCUN contrôle d'intégrité : une coupure réseau en
          #       cours de diffusion fait juste atteindre une fin de flux
          #       prématurée à `bash -s`, qui termine alors proprement sur
          #       le code de sortie de la DERNIÈRE commande déjà reçue (par
          #       exemple un `pull` réussi) - sans jamais avoir reçu ni
          #       exécuté le `up -d` ni la vérification qui suit. D'où :
          #       le script est maintenant transféré en ENTIER (SCP, qui
          #       échoue net sur une coupure au lieu de tronquer en
          #       silence), sa taille vérifiée, puis exécuté par un second
          #       appel SSH séparé - jamais diffusé en direct dans un
          #       canal qui pourrait se couper au milieu.
          #
          #    Les quelques valeurs qui doivent traverser CE shell (secrets
          #    GitHub) sont passées en variables d'environnement de la
          #    commande distante, chacune protégée par `printf %q` - qui
          #    gère aussi bien un secret vide qu'un secret contenant un saut
          #    de ligne final ou un guillemet.
          STAGING_SSH_HOST="$(printf '%s' "$STAGING_SSH_HOST" | tr -d '\n\r')"
          STAGING_SSH_USER="$(printf '%s' "$STAGING_SSH_USER" | tr -d '\n\r')"
          STAGING_DEPLOY_PATH="$(printf '%s' "$STAGING_DEPLOY_PATH" | tr -d '\n\r')"

          REMOTE_ENV=$(printf 'STAGING_DEPLOY_PATH=%q COMMIT_SHA=%q GHCR_TOKEN=%q GHCR_ACTOR=%q API_IMAGE=%q WEB_IMAGE=%q PORTAL_IMAGE=%q' \
            "$STAGING_DEPLOY_PATH" "$COMMIT_SHA" "$GHCR_TOKEN" "$GHCR_ACTOR" "$API_IMAGE" "$WEB_IMAGE" "$PORTAL_IMAGE")

          SCRIPT_LOCAL="$RUNNER_TEMP/deploy-remote.sh"
          SCRIPT_REMOTE="/tmp/elyon-deploy-${{ github.run_id }}.sh"

          cat > "$SCRIPT_LOCAL" <<'REMOTE'
            set -euxo pipefail
            cd "$STAGING_DEPLOY_PATH"

            # Un seul jeu de fichiers de composition, réutilisé PARTOUT dans
            # ce script — jamais un sous-ensemble ici et un autre plus bas :
            # postgres/redis/migrator ne sont pas différents d'un overlay à
            # l'autre aujourd'hui, mais s'en assurer au cas par cas serait un
            # piège qui n'attend qu'un futur changement pour mordre.
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.staging.yml"

            # Seuls les fichiers de composition, le contexte de `proxy` et le
            # code source de l'API (pour `migrator`, voir plus bas) ont besoin
            # d'être à jour ici — `api`, `web` et `portal` viennent de GHCR,
            # pas de ce clone.
            git fetch origin dev
            git checkout dev
            git reset --hard "$COMMIT_SHA"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            export API_IMAGE WEB_IMAGE PORTAL_IMAGE
            export IMAGE_TAG="$COMMIT_SHA"

            $COMPOSE pull api web portal

            # `proxy` seul continue de se construire ici — voir l'en-tête de
            # ce fichier.
            $COMPOSE build proxy

            $COMPOSE up -d postgres redis

            # ⚠️ db:deploy, JAMAIS la commande par défaut du conteneur (qui
            #    sème un jeu de données de démonstration) — voir
            #    docker-compose.yml et DEPLOIEMENT.md § 4.
            $COMPOSE --profile tools run --rm migrator \
              sh -c "npm ci && npm run db:deploy"

            # Sans effet si un DG existe déjà (compte gardé par
            # prisma/bootstrap-admin.ts) — rejoué à chaque déploiement pour
            # que le tout premier push après un provisionnement ou une
            # restauration de base crée le compte sans geste manuel séparé.
            # Lit BOOTSTRAP_ADMIN_EMAIL/NAME/PASSWORD depuis le .env déjà en
            # place sur ce VPS (§ 3 de DEPLOIEMENT_STAGING.md) — aucune de
            # ces valeurs ne transite par ce workflow.
            $COMPOSE --profile tools run --rm migrator \
              sh -c "npm ci && npm run db:bootstrap-admin"

            $COMPOSE up -d

            # ⚠️ VÉRIFIE QUE LES CONTENEURS TOURNENT VRAIMENT SUR L'IMAGE
            #    ATTENDUE - `up -d` PEUT RÉUSSIR SANS RIEN RECRÉER.
            #
            #    Constaté en direct : un premier passage a rapporté un succès
            #    de bout en bout (health check compris) alors qu'`api`/`web`/
            #    `portal` étaient restés sur l'image de la veille - `pull`
            #    avait bien récupéré la bonne image, mais `up -d` ne l'avait
            #    pas reconnue comme un changement à ce moment-là. Un succès
            #    qui ne déploie rien est pire qu'un échec net : rien ne le
            #    signale à qui ne va pas vérifier à la main.
            for pair in "api:$API_IMAGE" "web:$WEB_IMAGE" "portal:$PORTAL_IMAGE"; do
              service="${pair%%:*}"
              cible="${pair#*:}:$IMAGE_TAG"
              attendu="$(docker image inspect --format '{{.Id}}' "$cible")"
              courant="$(docker inspect --format '{{.Image}}' "$($COMPOSE ps -q "$service")")"
              if [ "$attendu" != "$courant" ]; then
                echo "ATTENTION $service tourne encore sur une image differente de celle qui vient d'etre preparee." >&2
                echo "Nouvelle tentative de recreation forcee." >&2
                $COMPOSE up -d --force-recreate "$service"
              fi
            done

            for i in $(seq 1 60); do
              if $COMPOSE exec -T api node -e "require('http').get({host:'127.0.0.1',port:3000,path:'/health',timeout:4000},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"; then
                echo "Pile de staging prete."
                exit 0
              fi
              sleep 2
            done
            echo "La pile de staging ne repond toujours pas apres 120 s." >&2
            $COMPOSE ps
            exit 1
          REMOTE

          cleanup() {
            ssh "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" "rm -f ${SCRIPT_REMOTE}" 2>/dev/null || true
          }
          trap cleanup EXIT

          scp "$SCRIPT_LOCAL" "${STAGING_SSH_USER}@${STAGING_SSH_HOST}:${SCRIPT_REMOTE}"

          # ⚠️ SCP ÉCHOUE DÉJÀ NET SUR UNE COUPURE EN COURS DE TRANSFERT - CE
          #    CONTRÔLE DE TAILLE EST UNE CEINTURE EN PLUS DES BRETELLES, PAS
          #    LA SEULE GARDE. Il coûte une commande, et rend visible dans le
          #    journal la preuve que le fichier exécuté ensuite est bien
          #    complet, plutôt que de faire confiance au seul code de retour.
          taille_locale="$(wc -c < "$SCRIPT_LOCAL")"
          taille_distante="$(ssh "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" "wc -c < '${SCRIPT_REMOTE}'")"
          if [ "$taille_locale" != "$taille_distante" ]; then
            echo "Transfert incomplet : ${taille_locale} octets envoyes, ${taille_distante} recus cote VPS." >&2
            exit 1
          fi

          # Exécution du fichier déjà en place sur le VPS, jamais d'un flux
          # diffusé en direct - voir l'explication en tête de cette étape.
          ssh "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" "$REMOTE_ENV bash '${SCRIPT_REMOTE}'"
