# ===========================================================================
#  ERP NÉGOCE PÉTROLIER — ORCHESTRATION
#  Réf. SPECIFICATIONS.md § 1.5
#
#  Segmentation réseau : PostgreSQL et Redis vivent sur un réseau `data`
#  déclaré `internal`, sans aucune route vers l'extérieur. Ils ne publient
#  aucun port. Seule l'API, présente sur les deux réseaux, peut les joindre.
#
#  Démarrage    : docker compose up -d
#  Migration    : docker compose --profile tools run --rm migrator
#  Développement: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ===========================================================================

name: elyon-erp

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true
  restart: unless-stopped

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true # Aucune route sortante. La base est inatteignable depuis l'extérieur.

volumes:
  postgres_data:
  redis_data:
  api_node_modules:

services:
  # -------------------------------------------------------------------------
  postgres:
    <<: *hardening
    image: postgres:16.4-alpine3.20
    # setgid/setuid/chown/fowner : strictement ce dont initdb a besoin.
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requis}
      ERP_APP_PASSWORD: ${ERP_APP_PASSWORD:?ERP_APP_PASSWORD requis}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    # Aucun port publié : la base n'est joignable que par le réseau `data`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # -------------------------------------------------------------------------
  redis:
    <<: *hardening
    image: redis:7.4.1-alpine3.20
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD requis}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction # Les sessions et les révocations de tokens ne s'évincent pas.
    volumes:
      - redis_data:/data
    networks:
      - data
    # L'entrypoint officiel ajuste les droits du volume puis abandonne les
    # privilèges vers l'utilisateur redis. Ces capabilities lui sont nécessaires
    # pour le faire — et uniquement celles-là.
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M

  # -------------------------------------------------------------------------
  api:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      # L'application se connecte avec erp_app — jamais avec le rôle de migration.
      DATABASE_URL: postgresql://erp_app:${ERP_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=10&pool_timeout=20
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PIVOT_CURRENCY: ${PIVOT_CURRENCY:-USD}
      LOCAL_CURRENCY: ${LOCAL_CURRENCY:-XOF}
      FISCAL_COUNTRY: ${FISCAL_COUNTRY:-CI}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET requis}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET requis}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY requis}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4300}
    networks:
      - edge
      - data
    ports:
      - "${API_PORT:-3000}:3000"
    read_only: true # Le conteneur ne peut rien écrire hors des tmpfs ci-dessous.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 768M

  # -------------------------------------------------------------------------
  #  Console interne Angular, servie par nginx qui relaie /api vers l'API.
  #  Une seule origine côté navigateur : pas de CORS à gérer.
  # -------------------------------------------------------------------------
  web:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    networks:
      - edge
    ports:
      - "${WEB_PORT:-4200}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M

  # -------------------------------------------------------------------------
  #  Conteneur outillage — migrations, contraintes SQL, jeu de données.
  #  Seul service à se connecter avec erp_migrator. Il ne tourne jamais
  #  en continu : `docker compose --profile tools run --rm migrator`.
  # -------------------------------------------------------------------------
  migrator:
    profiles: ["tools"]
    image: node:22.11.0-alpine3.20
    working_dir: /app
    environment:
      # Rôle propriétaire : DDL autorisé, le temps de la migration seulement.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PIVOT_CURRENCY: ${PIVOT_CURRENCY:-USD}
      LOCAL_CURRENCY: ${LOCAL_CURRENCY:-XOF}
      FISCAL_COUNTRY: ${FISCAL_COUNTRY:-CI}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-ChangeMe!2026}
    volumes:
      - ./apps/api:/app
      # Volume nommé PAR-DESSUS le bind mount. Sans lui, npm écrit ses dizaines
      # de milliers de fichiers à travers la couche de traduction du système
      # de fichiers hôte — quelques minutes sous Linux, une éternité sous
      # Windows et macOS. Ici node_modules vit côté Linux, et il persiste
      # entre deux exécutions.
      - api_node_modules:/app/node_modules
    networks:
      # `data` pour joindre PostgreSQL, `edge` pour joindre le registre npm.
      # Le réseau `data` est déclaré internal : rattaché à lui seul, ce
      # conteneur n'a aucune route sortante et npm install attend indéfiniment.
      - data
      - edge
    depends_on:
      postgres:
        condition: service_healthy
    # npm ci si un lockfile est présent (build reproductible), npm install sinon
    # — le lockfile n'existe pas encore au tout premier lancement.
    command: sh -c "if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi && npm run db:setup"
